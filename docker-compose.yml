version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: nhai-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhai-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/face-auth
      ML_SERVICE_URL: http://ml-service:5001
      JWT_SECRET: nhai-hackathon-super-secret-key-2026
      LIVENESS_THRESHOLD: 0.5
      MATCH_THRESHOLD: 0.6
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb

  ml-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    container_name: nhai-ml
    ports:
      - "5001:5001"
    environment:
      ML_SERVICE_PORT: 5001
      LIVENESS_MODEL_PATH: /app/models/liveness_int8.tflite
      RECOGNITION_MODEL_PATH: /app/models/recognition_embedding.keras
    volumes:
      - ./models:/app/models

  frontend:
    build:
      context: ./frontend
    container_name: nhai-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data:
